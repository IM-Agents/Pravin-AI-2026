version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: oma_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: order_management
      MYSQL_USER: oma_user
      MYSQL_PASSWORD: oma_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - oma_network

  # Redis for Queue Management
  redis:
    image: redis:7-alpine
    container_name: oma_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oma_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oma_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: order_management
      DB_USER: oma_user
      DB_PASSWORD: oma_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/pdfs:/app/pdfs
      - ./backend/uploads:/app/uploads
    depends_on:
      - mysql
      - redis
    networks:
      - oma_network
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oma_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - oma_network
    command: npm start

volumes:
  mysql_data:
  redis_data:

networks:
  oma_network:
    driver: bridge


  frontend:
    build: ./frontend
    container_name: oma-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_SOCKET_URL=http://localhost:5000
    networks:
      - oma-network
